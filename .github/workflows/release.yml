name: Build release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qt6-base-dev qt6-svg-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRIVET_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/rivet "dist/rivet-linux-${{ matrix.arch }}"
          chmod +x "dist/rivet-linux-${{ matrix.arch }}"
          (cd dist && sha256sum "rivet-linux-${{ matrix.arch }}" > "SHA256SUMS-${{ matrix.arch }}")

      - uses: actions/upload-artifact@v4
        with:
          name: rivet-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish rolling release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Rivet build ${{ github.sha }}
          body: |
            Automated build from commit `${{ github.sha }}` on `master`.

            - Linux x86_64
            - Linux aarch64

            ### Downloads

            - `rivet-linux-x86_64` / `rivet-linux-aarch64`: standalone Linux
              executables. `chmod +x` and run. Qt 6 and the runtime helpers must
              be installed (see the README).
            - `SHA256SUMS-*`: checksums.
          prerelease: false
          make_latest: "true"
          generate_release_notes: false
          files: dist/*
          fail_on_unmatched_files: true

  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build flake
        run: nix build .# --print-build-logs --no-link
